name: CI - Testes e Build do PWA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Baixar o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2️⃣ Instalar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instalar dependências da API
      - name: Instalar dependências da API
        working-directory: ./api
        run: npm install

      # 4️⃣ Rodar testes da API
      - name: Rodar testes da API
        working-directory: ./api
        run: npm test

      # 5️⃣ Instalar dependências do Web
      - name: Instalar dependências do Web
        working-directory: ./web
        run: npm install

      # 6️⃣ Rodar testes do Web
      - name: Rodar testes do Web
        working-directory: ./web
        run: npm test

      # 7️⃣ (Opcional) Build do frontend
      - name: Simular build do Web
        working-directory: ./web
        run: |
          mkdir -p dist
          cp -r public/* dist/
          echo "Build simulado concluído com sucesso"
